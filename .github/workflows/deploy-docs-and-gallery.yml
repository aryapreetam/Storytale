name: Deploy Documentation & Gallery

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'modules/runtime-api/**'
      - 'gallery-demo/**'
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'modules/runtime-api/**'
      - 'gallery-demo/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build Documentation, Dokka & Wasm Gallery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Build MkDocs Site
        run: mkdocs build --clean

      - name: Bypass Jekyll on GitHub Pages
        run: touch site/.nojekyll

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Dokka API Reference
        run: |
          ./gradlew :modules:runtime-api:dokkaGeneratePublicationHtml --no-daemon
          mkdir -p site/api
          cp -r modules/runtime-api/build/dokka/html/* site/api/

      - name: Build Canonical Wasm Gallery
        run: |
          ./gradlew :gallery-demo:wasmJsBrowserStoriesProductionExecutableDistribution --no-daemon
          mkdir -p site/gallery
          cp -r gallery-demo/build/dist/wasmJs/StoriesProductionExecutable/* site/gallery/

      - name: Fix Permissions
        run: |
          chmod -v -R +rX site/ | while read -r line; do
            echo "::debug::$line"
          done

      - name: Upload Pages Artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [ build-and-verify ]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
