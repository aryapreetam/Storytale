<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Isometric Cube -->
  <polygon
    points="50,9.5 85,29.7 85,70.3 50,90.5 15,70.3 15,29.7"
    stroke="#2F75E8"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Three Isometric Connecting Ribs -->
  <line
    x1="70.5" y1="38.1"
    x2="84.5" y2="30.0"
    stroke="#2F75E8"
    stroke-width="3.6"
    stroke-linecap="round"
  />
  <line
    x1="29.5" y1="38.1"
    x2="15.5" y2="30.0"
    stroke="#2F75E8"
    stroke-width="3.6"
    stroke-linecap="round"
  />
  <line
    x1="50.0" y1="72.5"
    x2="50.0" y2="90.0"
    stroke="#2F75E8"
    stroke-width="3.6"
    stroke-linecap="round"
  />

  <!-- Central Concentric Hexagon Core -->
  <polygon
    points="50,27.5 69.5,38.8 69.5,61.2 50,72.5 30.5,61.2 30.5,38.8"
    stroke="#2F75E8"
    stroke-width="7.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
